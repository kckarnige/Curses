<html>

<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="./styles.min.css" />
  <script type="module" src="./main.js"></script>
  <style>
    :root {
      --cursePreviewHighlight-light: var(--accent-dark);
      --cursePreviewHighlight-dark: var(--accent-bright);
      --cursePreviewHighlightClick-light: var(--accent-darker);
      --cursePreviewHighlightClick-dark: var(--accent-brighter);
      --sidebarBGHighlight-light: var(--accent-dark);
      --sidebarBGHighlight-dark: var(--accent-bright);
      --sidebarBGHighlightClick-light: var(--accent-darker);
      --sidebarBGHighlightClick-dark: var(--accent-brighter);
    }
  </style>
  <style id="systemAccents"></style>
</head>

  <div id="main-container">
    <div id="main">
      <!--p id="loading">Loading...</p-->
      <!--div id="cursorThemes"></div-->
      <div id="cursorPackager">
        <button id="cursorDir-button">
          <svg id="icon"><use href="#folder" /></svg><p>Cursor Folder</p>
        </button>
      </div>
    </div>
  </div>
  <div id="sidebar-container">
    <div id="sidebar" openTab="packager">
      <div id="sidebar-highlighter"></div>
      <div id="sidebar-button" class="themes-button">
        <div id="sidebar-icon">
          <svg id="icon">
            <use href="#pointer" />
          </svg>
        </div>
        <p id="sidebar-label">Cursors</p>
      </div>
      <div id="sidebar-button" class="packager-button">
        <div id="sidebar-icon">
          <svg id="icon">
            <use href="#archive" />
          </svg>
        </div>
        <p id="sidebar-label">Packager</p>
      </div>
      <div id="sidebar-button" class="info-button">
        <div id="sidebar-icon">
          <svg id="icon">
            <use href="#info" />
          </svg>
        </div>
        <p id="sidebar-label">About</p>
      </div>
    </div>
  </div>
  <p id="curCountInfo">Cursors: <span id="curCount"></span></p>

</html>
